name: Windows package

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          mkdir dist -Force
          go build -buildvcs=false -ldflags="-H windowsgui" -o dist/permitdenied.exe ./cmd/permitdenied

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: permitdenied-windows-amd64
          path: dist/permitdenied.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/permitdenied.exe
