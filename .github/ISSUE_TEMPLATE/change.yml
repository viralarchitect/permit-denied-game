name: Change
description: Propose a gameplay, code, or asset change that stays on this one strip.
title: "[Change]: "
labels: ["change"]
body:
  - type: markdown
    attributes:
      value: |
        Tune `internal/game/const.go` before adding a system. A threat that does not change **steering** does not ship.

        Out of spec (do not file): campaign, between-run meta, second lot, second player, chopper rockets, locational armor, soft-body debris, title `KILLDOZER`.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This stays on the current lot (no campaign, meta, or second strip)
          required: true
        - label: I checked `PERMIT_DENIED.md` (what) and `PERMIT_DENIED_GO_IMPLEMENTATION.md` (how)
          required: true
        - label: A const.go tweak is not enough (or I explain why below)
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a player cannot do, or which show-off test fails.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change. Name the spec section or file if you know it (`const.go`, `lot.go`, `sim.go`, `assets/usable/`).
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Tune existing numbers
        - Fix existing system
        - Art / atlas (same coordinates)
        - Docs only
        - New system (justify against the spec)
    validations:
      required: true
